<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>QRscanner</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#020617,#0f172a);color:#f8fafc;font-family:system-ui,sans-serif}main{max-width:680px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}h1{font-size:22px;margin:0}header span{color:#ccfbf1;border:1px solid #115e59;background:#0f3b3a;padding:6px 10px;border-radius:999px;font-size:13px}nav,.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}button{padding:14px;border:1px solid #334155;border-radius:15px;font-size:15px;font-weight:750;background:#111827;color:#e2e8f0;cursor:pointer}.primary,nav button.active{background:linear-gradient(135deg,#14b8a6,#0ea5e9);color:white;border-color:transparent}.cam{position:relative;background:black;border:1px solid #334155;border-radius:24px;aspect-ratio:3/4;overflow:hidden}video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;inset:20% 12%;border:2px solid #ffffff66;border-radius:18px;pointer-events:none}.frame:after{content:'';position:absolute;left:0;right:0;top:40%;height:3px;background:#14b8a6;box-shadow:0 0 18px #14b8a6}.status{padding:13px;border:1px solid #334155;border-radius:14px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}.help,label{color:#94a3b8;font-size:14px}.help{line-height:1.5}label{display:block;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #334155;border-radius:12px;background:#0b1220;color:white;font:inherit}.chips{display:flex;gap:8px;margin-bottom:12px}.chips button{padding:8px 14px;font-size:13px;border-radius:999px}.chips button.active{background:linear-gradient(135deg,#14b8a6,#0ea5e9)}canvas{display:block;max-width:100%;height:auto;margin:16px auto;background:white;border:12px solid white;border-radius:12px}[hidden]{display:none!important}
</style></head><body><main><header><h1>QRscanner</h1><span>Připraveno</span></header><nav><button id="scanTab" class="active">Skenovat</button><button id="genTab">Vytvořit QR</button></nav><section id="scan"><div class="cam"><video id="video" autoplay muted playsinline></video><div class="frame"></div></div><div class="buttons"><button id="start" class="primary">Spustit kameru</button><button id="upload">Nahrát obrázek</button><button id="copy">Kopírovat text</button><button id="again">Skenovat další</button></div><input id="file" type="file" accept="image/*" hidden><div id="scanStatus" class="status">Klepni na Spustit kameru a povol přístup.</div><div id="result" class="status" hidden></div><button id="open" class="primary" hidden>Otevřít odkaz v prohlížeči</button><p class="help">Čtečka vyžaduje podporu BarcodeDetector v prohlížeči. Kamera potřebuje zabezpečený kontext a povolení.</p></section><section id="generate" hidden><div class="chips"><button data-kind="text" class="active">Text / odkaz</button><button data-kind="wifi">Wi-Fi</button><button data-kind="pay">Platba</button></div><div id="textFields"><label for="text">Text nebo URL</label><textarea id="text" placeholder="https://…"></textarea></div><div id="wifiFields" hidden><label for="ssid">Název sítě (SSID)</label><input id="ssid"><label for="password">Heslo</label><input id="password"><label for="security">Zabezpečení</label><select id="security"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">Bez hesla</option></select></div><div id="payFields" hidden><label for="iban">IBAN příjemce</label><input id="iban"><label for="amount">Částka v Kč</label><input id="amount" inputmode="decimal"><label for="note">Zpráva pro příjemce</label><input id="note"></div><button id="make" class="primary" style="width:100%;margin-top:14px">Vygenerovat QR kód</button><div id="genStatus" class="status">Generátor potřebuje připojení pro načtení knihovny.</div><canvas id="qr" hidden></canvas><button id="save" hidden>Stáhnout PNG</button></section></main><script>
'use strict';const $=id=>document.getElementById(id);let kind='text',stream=null,running=false,raw='',url='';function stop(){running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null}function tab(make){stop();$('scan').hidden=make;$('generate').hidden=!make;$('scanTab').classList.toggle('active',!make);$('genTab').classList.toggle('active',make)}$('scanTab').onclick=()=>tab(false);$('genTab').onclick=()=>tab(true);document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));for(const k of ['text','wifi','pay'])$(k+'Fields').hidden=k!==kind;$('qr').hidden=$('save').hidden=true});function esc(s){return s.replace(/[\\;,:\"]/g,c=>'\\'+c)}function payload(){if(kind==='text'){if(!$('text').value.trim())throw Error('Zadej text nebo odkaz.');return $('text').value}if(kind==='wifi'){if(!$('ssid').value)throw Error('Zadej název sítě.');const sec=$('security').value;return `WIFI:T:${sec};S:${esc($('ssid').value)};P:${esc(sec==='nopass'?'':$('password').value)};;`}const iban=$('iban').value.replace(/\s/g,'').toUpperCase();if(!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(iban))throw Error('Zkontroluj IBAN.');let rearranged=iban.slice(4)+iban.slice(0,4),digits=rearranged.replace(/[A-Z]/g,c=>String(c.charCodeAt(0)-55)),rem=0;for(const c of digits)rem=(rem*10+Number(c))%97;if(rem!==1)throw Error('IBAN má neplatný kontrolní součet.');const a=$('amount').value.trim().replace(',','.');if(a&&(!/^\d+(\.\d{1,2})?$/.test(a)||Number(a)<=0))throw Error('Zadej kladnou částku, například 100.00.');const note=$('note').value;if(/[\*\r\n]/.test(note))throw Error('Zpráva nesmí obsahovat hvězdičku ani nový řádek.');return `SPD*1.0*ACC:${iban}${a?'*AM:'+a:''}*CC:CZK${note?'*MSG:'+note:''}`}
let library=null;function load(){if(typeof qrcode==='function')return Promise.resolve();if(library)return library;library=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';s.onload=()=>{if(typeof qrcode==='function')resolve();else reject(Error('Knihovna generátoru není dostupná.'))};s.onerror=()=>reject(Error('Knihovna se nenačetla. Ověř internet; aplikace neodesílá obsah QR na server.'));document.head.append(s)}).catch(e=>{library=null;throw e});return library}
$('make').onclick=async()=>{const b=$('make');b.disabled=true;$('qr').hidden=$('save').hidden=true;try{const text=payload();$('genStatus').textContent='Připravuji QR…';await load();qrcode.stringToBytes=s=>Array.from(new TextEncoder().encode(s));const q=qrcode(0,'M');q.addData(text,'Byte');q.make();const n=q.getModuleCount(),scale=Math.max(2,Math.floor(360/(n+8))),c=$('qr'),ctx=c.getContext('2d');c.width=c.height=(n+8)*scale;ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='black';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))ctx.fillRect((x+4)*scale,(y+4)*scale,scale,scale);c.hidden=$('save').hidden=false;$('genStatus').textContent='QR kód je hotový. Obsah byl zpracován pouze v prohlížeči.'}catch(e){$('genStatus').textContent='Chyba: '+(e.message||e)}finally{b.disabled=false}};$('save').onclick=()=>{const a=document.createElement('a');a.href=$('qr').toDataURL('image/png');a.download='qr-kod.png';a.click()};
function fields(text,separator){const result={};let part='',escaped=false;const parts=[];for(const c of text){if(escaped){part+=c;escaped=false}else if(c==='\\'){escaped=true}else if(c===separator){parts.push(part);part=''}else part+=c}parts.push(part);for(const p of parts){const i=p.indexOf(':');if(i>=0)result[p.slice(0,i)]=p.slice(i+1)}return result}function show(text){stop();raw=text;url='';let info=text;if(/^WIFI:/i.test(text)){const d=fields(text.slice(5),';');info=`Wi-Fi síť\nSíť: ${d.S||'—'}\nHeslo: ${d.P||'Bez hesla / neuvedeno'}\nZabezpečení: ${d.T||'Neuvedeno'}`}else if(/^SPD\*/i.test(text)){const d=fields(text,'*');info=`Platební QR\nÚčet: ${d.ACC||'—'}\nČástka: ${d.AM||'Neuvedena'} ${d.CC||''}\nZpráva: ${d.MSG||'—'}\nVariabilní symbol: ${d['X-VS']||'—'}`}else{try{const u=new URL(text.trim());if(['http:','https:'].includes(u.protocol))url=u.href}catch(e){}}$('result').textContent=info;$('result').hidden=false;$('open').hidden=!url;$('scanStatus').textContent=url?'Odkaz přečten. Před otevřením zkontroluj adresu.':'QR kód přečten.'}$('open').onclick=()=>{if(url)location.assign(url)};$('copy').onclick=async()=>{try{if(!raw)throw Error('Nejdřív naskenuj QR kód.');await navigator.clipboard.writeText(raw);$('scanStatus').textContent='Zkopírováno.'}catch(e){$('scanStatus').textContent=e.message}};async function detector(){if(!('BarcodeDetector'in window))throw Error('Tento prohlížeč nepodporuje čtečku QR. Generátor můžeš používat.');if(!(await BarcodeDetector.getSupportedFormats()).includes('qr_code'))throw Error('Formát QR není v tomto prohlížeči podporován.');return new BarcodeDetector({formats:['qr_code']})}async function camera(){stop();try{const d=await detector();if(!navigator.mediaDevices?.getUserMedia)throw Error('Otevři aplikaci přes HTTPS a povol kameru.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;await $('video').play();running=true;$('scanStatus').textContent='Kamera běží. Namíř na QR.';async function tick(){if(!running)return;try{if($('video').readyState>=2){const hits=await d.detect($('video'));if(hits.length){show(hits[0].rawValue);return}}}catch(e){stop();$('scanStatus').textContent='Chyba čtení kamery: '+e.message;return}setTimeout(tick,250)}tick()}catch(e){stop();$('scanStatus').textContent=e.message}}$('start').onclick=camera;$('again').onclick=()=>{$('result').hidden=$('open').hidden=true;camera()};$('upload').onclick=()=>$('file').click();$('file').onchange=async e=>{stop();const f=e.target.files[0];if(!f)return;try{const d=await detector(),bitmap=await createImageBitmap(f);try{const hits=await d.detect(bitmap);if(hits.length)show(hits[0].rawValue);else $('scanStatus').textContent='V obrázku nebyl nalezen QR kód.'}finally{bitmap.close()}}catch(e){$('scanStatus').textContent=e.message}$('file').value=''};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
</script></body></html>
